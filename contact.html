<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>12Budget — Contact</title>
    <link rel="stylesheet" href="site.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner"><a class="brand" href="./"><img class="brand-logo" src="assets/app_icon_512.png" alt="12Budget">12Budget</a>
            <nav class="site-nav"><a href="./" data-i18n="home">Home</a><a href="delete-account.html"
                    data-i18n="deletion">Delete account</a><a href="contact.html" aria-current="page"
                    data-i18n="contact">Contact</a></nav>
            <div class="controls"><select class="control" data-language aria-label="Language">
                    <option value="en">EN</option>
                    <option value="ru">RU</option>
                </select><button class="control" data-theme-toggle type="button" aria-label="Use dark theme">◐</button>
            </div>
        </div>
    </header>
    <main>
        <div class="eyebrow" data-i18n="contactEyebrow">Support</div>
        <h1 data-i18n="contactTitle">Contact us</h1>
        <p class="lead" data-i18n="contactLead">Send a question, suggestion, or report a problem. We will receive your
            message by email.</p>
        <form class="card" id="contact-form"><label for="name" data-i18n="name">Your name</label><input id="name"
                name="name" autocomplete="name" maxlength="100" required><label for="email" data-i18n="email">Email
                address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254"
                required><label for="subject" data-i18n="subject">Subject</label><input id="subject" name="subject"
                maxlength="160" required><label for="message" data-i18n="message">Message</label><textarea id="message"
                name="message" maxlength="5000" required></textarea><input class="hidden" name="website" tabindex="-1"
                autocomplete="off"><button class="button" type="submit" data-i18n="send">Send message</button>
            <p class="status" id="contact-status" aria-live="polite"></p>
        </form>
    </main>
    <footer><div class="footer-row"><span>© 2026 12Budget</span><span><a href="contact.html" data-i18n="contact">Contact</a> · <a href="delete-account.html" data-i18n="deletion">Delete account</a></span></div></footer>
    <script src="site.js"></script>
    <script>const url = 'https://adljphlfxgsrteolfxcc.supabase.co', key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkbGpwaGxmeGdzcnRlb2xmeGNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTUwMzIsImV4cCI6MjA5NjU3MTAzMn0.FN6cKacqQr2QDLnfnfmQdyhmmmyeRwTvs9m8cIVk-yc'; document.getElementById('contact-form').addEventListener('submit', async e => { e.preventDefault(); const f = e.currentTarget, b = f.querySelector('button'), s = document.getElementById('contact-status'), t = translations[document.documentElement.lang]; b.disabled = true; s.textContent = t.sending; s.classList.remove('error'); try { const v = Object.fromEntries(new FormData(f)), r = await fetch(`${url}/functions/v1/contact-form`, { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify(v) }); if (!r.ok) throw Error(); f.reset(); s.textContent = t.sent } catch (_) { s.textContent = t.sendFailed; s.classList.add('error') } finally { b.disabled = false } })</script>
</body>

</html>
